name: App Service Prod Gated Deployment

on:
  workflow_call:
    inputs:
      production_app_name:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      PROD_PUBLISH_PROFILE:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 🔑 REQUIRED FOR OIDC
    permissions:
      id-token: write
      contents: read

    env:
      TEST_BRANCH: prod-deploy-testing
      ARTIFACT_NAME: app-build
      PREPROD_SUFFIX: "-preprod"

    steps:
    # --------------------------------------------------
    # Checkout main
    # --------------------------------------------------
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: true

    # --------------------------------------------------
    # Create / update prod-deploy-testing branch
    # --------------------------------------------------
    - name: Sync prod-deploy-testing branch
      run: |
        git checkout -B $TEST_BRANCH origin/main
        git push origin $TEST_BRANCH --force

    # --------------------------------------------------
    # BUILD ONCE
    # --------------------------------------------------
    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Package build artifact
      run: |
        zip -r app-build.zip . \
          -x "*.git*" \
          -x "node_modules/.cache/*"

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: app-build.zip

    # --------------------------------------------------
    # Azure Login (OIDC — CORRECT)
    # --------------------------------------------------
    - name: Azure Login (OIDC)
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # --------------------------------------------------
    # DISCOVER PROD APP CONFIGURATION
    # --------------------------------------------------
    - name: Discover prod app configuration
      id: discover
      run: |
        PROD_APP="${{ inputs.production_app_name }}"

        RG=$(az webapp list \
          --query "[?name=='$PROD_APP'].resourceGroup | [0]" \
          -o tsv)

        if [ -z "$RG" ]; then
          echo "❌ Production app '$PROD_APP' not found"
          exit 1
        fi

        PLAN_ID=$(az webapp show \
          --name "$PROD_APP" \
          --resource-group "$RG" \
          --query serverFarmId \
          -o tsv)

        RUNTIME=$(az webapp config show \
          --name "$PROD_APP" \
          --resource-group "$RG" \
          --query linuxFxVersion \
          -o tsv)

        echo "resource_group=$RG" >> $GITHUB_OUTPUT
        echo "app_service_plan=$PLAN_ID" >> $GITHUB_OUTPUT
        echo "runtime=$RUNTIME" >> $GITHUB_OUTPUT

    # --------------------------------------------------
    # CREATE PRE-PROD APP (INHERITS PROD)
    # --------------------------------------------------
    - name: Create Pre-Prod App Service
      run: |
        PREPROD_APP="${{ inputs.production_app_name }}${{ env.PREPROD_SUFFIX }}"

        az webapp create \
          --name "$PREPROD_APP" \
          --resource-group "${{ steps.discover.outputs.resource_group }}" \
          --plan "${{ steps.discover.outputs.app_service_plan }}" \
          --runtime "${{ steps.discover.outputs.runtime }}"

    # --------------------------------------------------
    # DEPLOY ARTIFACT TO PRE-PROD
    # --------------------------------------------------
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}

    - name: Deploy to Pre-Prod
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ inputs.production_app_name }}${{ env.PREPROD_SUFFIX }}
        publish-profile: ${{ secrets.PROD_PUBLISH_PROFILE }}
        package: app-build.zip

    - name: Wait for Pre-Prod warm-up
      run: sleep 30

    # --------------------------------------------------
    # HEALTH CHECK GATE
    # --------------------------------------------------
    - name: Health check Pre-Prod
      run: |
        URL="https://${{ inputs.production_app_name }}${{ env.PREPROD_SUFFIX }}.azurewebsites.net/health"

        for i in {1..10}; do
          if curl -fs "$URL"; then
            echo "Pre-prod healthy"
            exit 0
          fi
          sleep 10
        done

        echo "❌ Pre-prod health check failed"
        exit 1

    # --------------------------------------------------
    # DEPLOY SAME ARTIFACT TO PROD
    # --------------------------------------------------
    - name: Deploy to Production
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ inputs.production_app_name }}
        publish-profile: ${{ secrets.PROD_PUBLISH_PROFILE }}
        package: app-build.zip

    # --------------------------------------------------
    # TAG LAST-KNOWN-GOOD
    # --------------------------------------------------
    - name: Tag last-known-good
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git tag -f last-known-good
        git push origin last-known-good --force

    # --------------------------------------------------
    # DELETE PRE-PROD APP
    # --------------------------------------------------
    - name: Delete Pre-Prod App Service
      run: |
        az webapp delete \
          --name "${{ inputs.production_app_name }}${{ env.PREPROD_SUFFIX }}" \
          --resource-group "${{ steps.discover.outputs.resource_group }}"
